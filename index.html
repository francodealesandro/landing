/* ─── [f] mark ───────────────────────────────────── */
const FMark = ({ size = 36 }) => {
  const bw  = size * 0.21;
  const sw  = Math.max(1, size * 0.065);
  const pad = Math.max(0.8, size * 0.04);
  const fSz = size * 0.58;
  const fY  = size * 0.765;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} fill="none">
      <path d={`M${bw} ${size*0.09} L${pad} ${size*0.09} L${pad} ${size*0.91} L${bw} ${size*0.91}`}
        stroke={C.lavanda} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"/>
      <path d={`M${size-bw} ${size*0.09} L${size-pad} ${size*0.09} L${size-pad} ${size*0.91} L${size-bw} ${size*0.91}`}
        stroke={C.lavanda} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"/>
      <text x={size/2} y={fY} fontFamily="'JetBrains Mono',monospace"
        fontSize={fSz} fontWeight="500" fill={C.magenta} textAnchor="middle"
        style={{fontFamily:"'JetBrains Mono',monospace"}}>f</text>
    </svg>
  );
};
